# ──────────────────────────────────────────────────────────────────────────────
# Leviathan Login Screen Configuration
# All coordinates are in pixels. Use -1 for auto-center, -2 for right-biased.
# ──────────────────────────────────────────────────────────────────────────────

[layout]

# ── Logo (top-left, clean & crisp silhouette) ─────────────────────────────────
logo_x = 80
logo_y = 60
logo_w = 96
logo_h = 96

# ── Account Switcher (consistent 440px width, refined height) ─────────────────
user_x   = 80
user_y   = 350
user_w   = 440
user_h   = 72

# ── Password Box (consistent 440px width, sleek masked field) ────────────────
password_x = 80
password_y = 436
password_w = 440
password_h = 62

# ── Desktop Environment Selector (consistent 440px width, secondary) ─────────
desktop_env_x = 80
desktop_env_y = 512
desktop_env_w = 440
desktop_env_h = 52

# ── Clock / Time ──────────────────────────────────────────────────────────────
# time_x: exact pixel X | -1 = centered | -2 = right-biased (65% of screen)
# time_y: exact pixel Y | -1 = vertical eye-level
time_x     = -2
time_y     = -1
time_scale = 6
show_date  = true
date_y     = -1

# ── Status Capsule (top-right: Wi-Fi, Volume, Battery stages) ─────────────────
show_status_capsule = true
status_capsule_x = -1
status_capsule_y = 36

# ── Prominent Power Menu (bottom-right: Sleep, Restart, Shut Down) ────────────
show_power_menu = true
power_x = -1
power_y = -1

[theme]

# ── Atmosphere ────────────────────────────────────────────────────────────────
# Minimal, unbloated, clean glassy feel
show_volumetric_light    = true
show_ambient_leviathan   = false
show_particles           = false
