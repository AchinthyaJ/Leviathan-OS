[accessibility]
ui_scale = 0.90

[bar.default]
center = [
    "spacer_1",
    "workspaces",
    "spacer_1",
    "active_window",
    "spacer_1"
]

background_opacity = 0.65
concave_edge_corners = true

start = [
    "launcher",
    "spacer_1",
    "clock",
    "spacer_1",
    "group:g1"
]

end = [
    "media",
    "spacer_1",
    "tray",
    "spacer_1",
    "notifications",
    "spacer_1",
    "network",
    "spacer_1",
    "battery",
    "spacer_1",
    "volume",
    "spacer_1",
    "session"
]

margin_edge = 10
margin_ends = 16

radius_bottom_left = 16
radius_bottom_right = 16
radius_top_left = 16
radius_top_right = 16

scale = 1.1
thickness = 40

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = false
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "secondary"
format = "{:%H:%M}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false

[desktop_widgets]
enabled = true
widget_order = ["desktop_clock"]

[desktop_widgets.widget.desktop_clock]
type = "clock"
cx = 960.0
cy = 540.0
box_width = 0.0
box_height = 0.0

[desktop_widgets.widget.desktop_clock.settings]
clock_style = "digital"
format = "{:%H:%M}\n%A · %d %B"
color = "on_surface"
shadow = true
background = false
center_text = true

[plugin_settings."noctalia/bongocat"]
input_devices = ["/dev/input/event20"]
