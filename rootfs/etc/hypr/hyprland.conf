# Hyprland configuration for Leviathan OS
# Noctalia desktop shell integration

################
### MONITORS ###
################

# Configure Virtual-1 (virtio-gpu output) and disable Unknown-1 (simple-framebuffer)
# Explicit mode, not "preferred": an unaligned width makes the scanout stride
# mismatch the buffer pitch, which shears the image diagonally.
monitor = Virtual-1, 1920x1080@60, 0x0, 1, bitdepth, 8
monitor = Unknown-1, disable
monitor = , 1920x1080@60, auto, 1, bitdepth, 8

###################
### ENVIRONMENT ###
###################

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = GDK_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_PLUGIN_PATH,/usr/lib/x86_64-linux-gnu/qt5/plugins
env = QT_QPA_PLATFORM_PLUGIN_PATH,/usr/lib/x86_64-linux-gnu/qt5/plugins/platforms
env = MOZ_ENABLE_WAYLAND,1
# NOTE: do not set EGL_PLATFORM here. It is inherited by Hyprland itself, and
# "wayland" makes EGL init as a client of a parent compositor that does not
# exist. Hyprland needs the GBM platform. Clients infer wayland from
# WAYLAND_DISPLAY on their own.
env = AQ_NO_MODIFIERS,1
env = AQ_FORCE_LINEAR_BLIT,0
env = AQ_NO_ATOMIC,1
env = AQ_MGPU_NO_EXPLICIT,1
env = AQ_DRM_DEVICES,/dev/dri/card0

#####################
### EXEC ON LAUNCH ###
#####################

# Wallpaper
exec-once = swaybg -i /usr/share/noctalia/assets/default-wallpaper.png -m fill

# Audio (PipeWire + WirePlumber session manager)
exec-once = pipewire
exec-once = pipewire -c pipewire-pulse.conf
exec-once = wireplumber

# Launch Noctalia shell on startup
exec-once = noctalia

# Wayland socket permissions
exec-once = sh -c "sleep 0.5; chmod 777 /run/user/0/wayland* 2>/dev/null"



##################
### INPUT       ###
##################

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

###################
### GENERAL UX  ###
###################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(61afeeff) rgba(c678ddff) 45deg
    col.inactive_border = rgba(282c34aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# Noctalia layer shell rules (commented to prevent config parse errors in Hyprland 0.56)
# layerrule = blur, ^(noctalia.*)$
# layerrule = ignorealpha 0.5, ^(noctalia.*)$


animations {
    enabled = false
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    disable_watchdog_warning = true
    disable_xdg_env_checks = true
    background_color = rgb(000000)
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# virgl cannot transfer RGBA16F textures: FP16 workbuffers fail TRANSFER3D with
# GL_INVALID_FRAMEBUFFER_OPERATION, and the 8->4 bytes/pixel pitch mismatch on
# scanout shears the image diagonally. Keep everything at 8-bit UINT.
render {
    use_fp16 = 0
    cm_enabled = false
    direct_scanout = false
}

cursor {
    no_hardware_cursors = true
    use_cpu_buffer = false
}

debug {
    damage_tracking = 0
    suppress_errors = true
    disable_logs = false
    enable_stdout_logs = true
}

# Persistent workspaces for Noctalia bar
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

####################
### KEYBINDINGS  ###
####################

$mod = SUPER

# Applications
bind = $mod, Return, exec, kitty
bind = $mod, BackSpace, exec, kitty
bind = $mod, E, exec, dolphin
bind = $mod, B, exec, firefox
bind = $mod, Space, exec, noctalia msg launcher-toggle || noctalia
bind = $mod, D, exec, noctalia msg launcher-toggle || noctalia
bind = $mod, S, exec, noctalia msg settings-open || noctalia
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Window focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Hardware controls (Volume, Media, Backlight)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Recovery
bind = $mod SHIFT, F1, exec, chvt 1
