set timeout=2
set default=0


insmod all_video
insmod gfxterm
set gfxmode=1920x1080,1280x800,1024x768,auto
set gfxpayload=keep

menuentry "Leviathan" {
    linux /boot/vmlinuz quiet loglevel=0 rd.udev.log_level=3 vt.global_cursor_default=0 video=Virtual-1:1920x1080@60 console=ttyS0,115200 console=tty0 net.ifnames=0 biosdevname=0 initcall_blacklist=simpledrm_platform_driver_init
    initrd /boot/initramfs.img
}


