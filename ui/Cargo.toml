[package]
name = "leviathan-ui"
version = "0.1.0-alpha.1"
edition = "2021"

[dependencies]
libc = "0.2"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "4.0"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
sha-crypt = "0.5"
fontdue = "0.9"

[lib]
name = "leviathan_ui"
path = "src/lib.rs"

[[bin]]
name = "leviathan-ui"
path = "src/main.rs"

[[bin]]
name = "leviathan"
path = "src/bin/leviathan_cli.rs"

[[bin]]
name = "leviathan-preview"
path = "src/bin/leviathan_preview.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
